name: Validar la aplicación integrada
on:
  pull_request:
  push:
    branches: ['fase-*/**']

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run check
        working-directory: .upstream/cuaderno
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit
