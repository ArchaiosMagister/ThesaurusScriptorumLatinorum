name: Validar la aplicación integrada
on:
  pull_request:
  push:
    branches: ['fase-*/**']

concurrency:
  group: integrated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm test && npm run test:ipad-selection && node tests/collatinus-grammar-integration.mjs
        working-directory: vendor/cuaderno
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit -- -g 'la ficha Collatinus'
      - run: npm run test:webkit
