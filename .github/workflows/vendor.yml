name: Incorporar motores en Thesaurus
on:
  push:
    branches: ['audit/autonomia-regeneracion-collatinus-20261123']
    paths:
      - '.github/workflows/vendor.yml'
      - 'scripts/vendor-upstreams.mjs'
      - 'upstream.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copiar los dos motores fijados y verificar sus huellas
        run: npm run vendor
      - name: Incorporar las instantáneas exclusivamente a la rama de auditoría
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if ! git diff --cached --quiet; then
            git commit -m "chore(vendor): include pinned legacy engines as self-contained sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
